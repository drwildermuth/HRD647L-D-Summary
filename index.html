<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Project Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root {
  --bg: #fbfaf9; --surface: #ffffff; --fg: #1f2328; --muted: #5d6470; --line: #dcd8d4;
  --red: #980000; --red-soft: #f6e9e9; --navy: #073763; --blue-soft: #e8eff6; --gray-soft: #efeeec; --prompt: #eceae7;
  --focus: #073763;
  --font: "Carlito", Calibri, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17181a; --surface: #202225; --fg: #e8e6e3; --muted: #a2a7b0; --line: #3a3d42;
  --red: #ff8a80; --red-soft: #3a2323; --navy: #8fbce6; --blue-soft: #1f2d3b; --gray-soft: #2a2c2f; --prompt: #2b2d30;
  --focus: #8fbce6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17181a; --surface: #202225; --fg: #e8e6e3; --muted: #a2a7b0; --line: #3a3d42;
  --red: #ff8a80; --red-soft: #3a2323; --navy: #8fbce6; --blue-soft: #1f2d3b; --gray-soft: #2a2c2f; --prompt: #2b2d30;
  --focus: #8fbce6; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 18px; line-height: 1.55; }
button, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 16px 28px max(16px, env(safe-area-inset-left, 0px)); position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; }
.brand { font-weight: 700; color: var(--red); font-size: 19px; line-height: 1.25; margin: 0 0 14px; }
.progress { margin-bottom: 14px; }
#progtext { font-size: 15px; color: var(--muted); }
#progbar { height: 8px; background: var(--gray-soft); border-radius: 4px; margin-top: 6px; overflow: hidden; }
#progfill { height: 100%; width: 0; background: var(--red); transition: width .25s; }
#navlist { list-style: none; margin: 0; padding: 0; }
.navphase { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); font-weight: 700; margin: 16px 0 4px; }
.navitem { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 16px; line-height: 1.3; }
.navitem:hover { background: var(--gray-soft); }
.navitem.current { background: var(--red-soft); font-weight: 700; }
.dot { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.navitem.isdone .dot { background: var(--red); border-color: var(--red); color: var(--surface); }
.navitem.current .dot { border-color: var(--red); color: var(--red); }
.navitem.isdone.current .dot { color: var(--surface); }

.topbar { display: none; }
.banner { background: var(--blue-soft); border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px 16px; font-size: 15px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
#savestatus { color: var(--muted); }
.themebtn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 14px; }
main { min-width: 0; }
.page { max-width: 760px; margin: 0 auto; padding: 28px max(20px, env(safe-area-inset-right, 0px)) 72px 20px; display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 32px; line-height: 1.15; color: var(--red); margin: 0; text-wrap: balance; }
h2 { font-size: 22px; color: var(--navy); font-style: italic; margin: 14px 0 0; }
.eyebrow { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); font-weight: 700; margin-bottom: -8px; }
.lead { font-size: 20px; color: var(--muted); margin: 0; }
.para { margin: 0; max-width: 68ch; }
.blk { display: flex; flex-direction: column; gap: 10px; }
.blk + .blk { border-top: 1px solid var(--line); padding-top: 18px; }
.lab { display: inline-flex; align-items: center; gap: 8px; color: var(--red); font-weight: 700; font-size: 17px; letter-spacing: .02em; }
.ico { width: 22px; height: 22px; fill: none; stroke: var(--red); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.field { display: flex; flex-direction: column; gap: 4px; }
.flabel { font-weight: 700; color: var(--navy); font-size: 16px; }
.inp { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: vertical; line-height: 1.45; field-sizing: content; min-height: 2.6em; }
.inp.area { min-height: 5em; } .inp.big { min-height: 9em; } .inp.line { min-height: 2.6em; }
.inp:hover { border-color: var(--muted); }
input.inp.line { field-sizing: fixed; }

.maker { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.maker summary { cursor: pointer; padding: 10px 14px; font-weight: 700; color: var(--navy); }
.makerbody { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: 16px; }
.chip:hover { border-color: var(--navy); }
.chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: var(--surface); font-weight: 700; }
.sentence { background: var(--blue-soft); border-radius: 6px; padding: 10px 14px; }

.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.promptwrap { background: var(--prompt); border-radius: 8px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.prompthead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ptitle { font-weight: 700; color: var(--navy); font-size: 16px; }
.prompt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 17px; line-height: 1.5; max-height: 26rem; overflow-y: auto; padding-right: 4px; }
.ph { background: var(--red-soft); color: var(--red); border-radius: 3px; padding: 0 3px; font-weight: 700; }
.copynote { font-size: 15px; color: var(--muted); }
.copynote:empty { display: none; }

.callout { border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.callout.tone-blue { background: var(--blue-soft); } .callout.tone-gray { background: var(--gray-soft); } .callout.tone-red { background: var(--red-soft); }
.callout ul { margin: 0; padding-left: 22px; } .ctitle { font-weight: 700; color: var(--navy); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cmpbox { background: var(--gray-soft); border-radius: 8px; padding: 12px 14px; font-size: 17px; }
.cmpbox.better { background: var(--blue-soft); }
.blk.compare { border-top: 1px solid var(--line); padding-top: 18px; }
.blk.callout, .blk.plain { border-top: 0; padding-top: 0; }
.blk.callout { padding: 12px 16px; }
.keylist { display: flex; flex-direction: column; gap: 8px; }
.keyrow { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 12px; align-items: baseline; }

.donecheck { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; width: fit-content; padding: 6px 0; }
.donecheck input { width: 22px; height: 22px; accent-color: var(--red); }

.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; background: var(--surface); border: 1.5px solid var(--navy); color: var(--navy); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 700; font-size: 16px; }
.btn:hover { background: var(--blue-soft); }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--surface); width: fit-content; }
.btn.primary:hover { filter: brightness(1.1); background: var(--red); }
.btn.small { padding: 4px 12px; font-size: 15px; }
.btn.copy { padding: 4px 14px; font-size: 15px; }
.btn.danger { border-color: var(--red); color: var(--red); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pn { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
.msg:empty { display: none; }
.inlinelink { color: var(--navy); font-weight: 700; }

#scrim { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(320px, 86vw); height: auto; transform: translateX(-102%); transition: transform .2s; padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  body.navopen .side { transform: none; box-shadow: 0 0 30px rgba(0,0,0,.35); }
  body.navopen #scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
  h1 { font-size: 27px; } .keyrow, .cmp { grid-template-columns: 1fr; gap: 4px; }
  .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Guide steps">
    <p class="brand">Working With a Client Under Time Pressure</p>
    <div class="progress"><div id="progtext">0 of 5 steps done</div><div id="progbar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" aria-label="Steps done"><div id="progfill"></div></div></div>
    <ul id="navlist"></ul>
  </nav>
  <div id="scrim"></div>
  <div>
    <div class="topbar"><button class="btn small" id="menubtn" type="button" aria-label="Open the list of steps">Steps</button><span class="brand" style="margin:0;font-size:17px">Client Project Guide</span></div>
    <div class="banner"><span><strong>Your notes save in this browser on this device only.</strong> Save a backup file now and then. Do not type confidential client information.</span><span><span id="savestatus"></span> <button class="themebtn" id="themebtn" type="button">Light / dark</button></span></div>
    <main id="main"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>
/* Notes collection and export. Pure functions. */
function collectNotes(CONTENT, data) {
  var out = [];
  function val(k) { var v = data[k]; return typeof v === 'string' ? v.trim() : v; }
  CONTENT.phases.forEach(function (ph) {
    ph.steps.forEach(function (st) {
      var items = [];
      st.blocks.forEach(function (b) {
        (b.fields || []).forEach(function (f) { var v = val(f.key); if (v) items.push({ label: f.label, text: v }); });
      });
      var done = !!data[st.doneKey];
      if (items.length || done) out.push({ heading: st.title, done: done, items: items });
    });
  });
  return out;
}
function notesToText(title, notes) {
  var L = [title, ''];
  notes.forEach(function (s) {
    L.push(s.heading + (s.done ? '  [marked done]' : '')); L.push('');
    s.items.forEach(function (it) { L.push(it.label); L.push(it.text); L.push(''); });
  });
  return L.join('\n');
}
function buildDocx(lib, title, notes) {
  var Document = lib.Document, Paragraph = lib.Paragraph, TextRun = lib.TextRun, HeadingLevel = lib.HeadingLevel;
  var kids = [], F = 'Calibri';
  kids.push(new Paragraph({ children: [new TextRun({ text: title, bold: true, size: 32, color: '980000', font: F })], spacing: { after: 240 } }));
  notes.forEach(function (s) {
    kids.push(new Paragraph({ heading: HeadingLevel.HEADING_2, spacing: { before: 280, after: 120 },
      children: [new TextRun({ text: s.heading, bold: true, italics: true, size: 24, color: '073763', font: F })] }));
    if (s.done) kids.push(new Paragraph({ spacing: { after: 100 }, children: [new TextRun({ text: 'Marked done', size: 20, color: '595959', font: F })] }));
    s.items.forEach(function (it) {
      kids.push(new Paragraph({ spacing: { before: 100, after: 40 }, children: [new TextRun({ text: it.label, bold: true, size: 22, color: '980000', font: F })] }));
      String(it.text).split('\n').forEach(function (ln) {
        kids.push(new Paragraph({ spacing: { after: 60 }, children: [new TextRun({ text: ln, size: 22, font: F })] }));
      });
    });
  });
  return new Document({ sections: [{ properties: {}, children: kids }] });
}
if (typeof module !== 'undefined') module.exports = { collectNotes: collectNotes, notesToText: notesToText, buildDocx: buildDocx };

var CONTENT = {
  title: "Working With a Client Under Time Pressure: A Guided Exploration",
  intro: "This is a guide to help you get started. You do not need to submit anything yet.",
  paras: [
    "Real clients are busy, give you information in pieces, and sometimes answer a different question than the one you asked. You will rarely have everything you want before you have to start. In fact, this is why “real-life” practitioners often criticize the ADDIE model: it’s too rigid, assuming each step smoothly leads to the next.",
    "This guide shows you how to use AI to move faster without letting it do your thinking. The rule is simple: AI organizes and proposes; you check and decide."
  ],
  note: "A note here: This is not about “not wanting you to use AI.” Learning & development professionals use AI quite a bit these days. It’s about doing what we often call in the field “keeping the leader in the loop” — ensuring that you, the human, are firmly in charge. Also, from personal experience: AI-generated courses tend to be pretty and well written, but they seldom (unless you work quite a bit on prompting, changing, challenging, etc.) follow Merrill’s Principles of Instruction. Instead, they are more likely to fit the “teach and quiz” variety. In particular, AI-generated scenarios can have one serious fault: they are too obvious. The “right” answer is smooth, precise, and often detailed. The “wrong” answer is so obviously wrong that the exercise is unlikely to lead to learning.",
  howto: "There are five steps. You say what you need and what you know, and the AI researches and organizes. You read it and mark what matters. You write a learning objective. The AI proposes scenario ideas, and then builds one into a full scenario. The page builds each prompt from what you type. You copy it into your AI and read what comes back. Every step uses the same five signs, so you always know who is doing what.",
  key: [
    { icon: "pencil", label: "Your turn", text: "The part only you can do." },
    { icon: "msg", label: "Ask your AI", text: "A prompt to copy into your AI tool. Parts in [brackets] fill in from what you have already typed." },
    { icon: "search", label: "Check it", text: "What to question before you go on. Nothing to type." },
    { icon: "done", label: "Done when", text: "What you should have before you move on." },
    { icon: "warn", label: "Watch out", text: "A rule or risk to keep in mind." }
  ],
  howtoNote: [
    "Work in one AI chat, so the AI keeps your documents and earlier answers. The only exception is the critique in Step 5, which uses a fresh chat on purpose. You paste the AI’s reply back here only when the page asks. If you start a new chat, paste in the summary from Step 1 first.",
    "You are not expected to write the scenario yourself. The AI drafts it. You judge it, find what is not right, and direct the changes. Where you do not know the industry, check with sources and the client.",
    "You do not need to have everything before you start. Keep a list of what is missing, and keep moving. Keep the links to your AI chats. You may be asked to show how you used AI."
  ],
  closing: "Your objectives and your notes on what matters most go straight into your project proposal. Your open questions are what you send the client.",
  bloom: [["Remember", ["list", "name", "recall", "identify", "state"]], ["Understand", ["explain", "summarize", "describe", "classify", "paraphrase"]], ["Apply", ["use", "carry out", "demonstrate", "perform", "apply"]], ["Analyze", ["compare", "distinguish", "diagnose", "examine", "differentiate"]], ["Evaluate", ["judge", "justify", "prioritize", "critique", "defend"]], ["Create", ["design", "draft", "propose", "construct", "develop"]]],
  phases: [
    { name: "Understand", steps: [
      { title: "Step 1. Tell the AI what you need and what you know", doneKey: "s1_done",
        purpose: "Say what you need and what you have. The AI finds more, organizes everything, and does not write anything yet.",
        blocks: [
          { t: "turn", text: "Four short entries. The page builds your prompt from them.", fields: [
            { key: "s1_audience", label: "Who is the course for? (for example, service managers at a material handling company)", kind: "line" },
            { key: "s1_need", label: "What does the course have to change? (what is going wrong now, and what should people do differently)", kind: "area" },
            { key: "s1_know", label: "What do I already know or have? (documents, notes, what the client told me, links. One line each.)", kind: "area" },
            { key: "s1_ask", label: "Anything specific I need the AI to find or produce? (optional)", kind: "area" } ] },
          { t: "callout", tone: "blue", paras: [
            { lead: "Working on the class client?", text: "Use the materials your instructor shared in the course. Do not contact the client; your instructor will tell you where to send questions." },
            { lead: "Working on your own client?", text: "Use what the client has given you. If you have almost nothing, stop and get the basics first: the client’s purpose with the training, the audience, the problem, and examples of it happening. Without some real information from a client, you cannot build a course likely to help." } ] },
          { t: "watch", paras: [
            { lead: "Public information:", text: "It helps you understand the client. It does not go into the course unless the client asks for it. If the AI finds lawsuits, citations, or news about incidents, knowing about them does not mean building a scenario around them." },
            { lead: "Confidential documents:", text: "Before you attach or paste anything into an AI tool, make sure you are allowed to. If you are not sure, ask the client. Do not paste anything marked confidential." } ] },
          { t: "ai", intro: "Attach your documents to your AI chat, then paste this prompt. If a [bracket] is still red, go back and fill it in. If your AI cannot search the web, it will tell you.", heading: "Paste this into your AI", prompt: `I am designing a short training course for [audience]. Here is what I need, what I already have, and what I want from you.

WHAT THE COURSE HAS TO CHANGE: [need]

WHAT I ALREADY HAVE: [know]

WHAT I NEED FROM YOU: [ask]

Do three things. First, organize what I gave you: the documents I attached or pasted and the notes above. Second, research what is missing: the client's organization and industry, the rules and standards that apply, how this kind of problem is usually handled, and recent public information. If you cannot search the web or open a link, say so. Do not treat anything you could not read as read. Third, merge everything into one summary. Do not write scenarios, objectives, or training content, and do not give recommendations.

Give me the summary as a table with one row per key fact and these columns: What it says (one line) | Where it came from (Client or me / Found online) | Source (the file or link name, plus a short exact quote of 15 words or fewer that I can find with Ctrl-F) | Status (Clear / Conflict / Unanswered / Check). Under the table, add four to six lines: what we know, where the sources conflict, and what is still missing. Then add details by topic, each point with its source and a short quote. Describe only what the sources say.

Rules:
- Keep what I told you separate from what you found. Never present something you found as something the client said.
- Court cases, lawsuits, and news about incidents go in a short section called BACKGROUND ONLY. Say what each document is, and do not summarize the facts of the case.
- If you are not sure a source says something, put it under Check. Do not guess.
- From now on, end every reply with a short list called OPEN QUESTIONS: anything you assumed, could not confirm, or that a different answer would change.
- Stop after the summary and details, and wait for my next instruction.`,
            fills: [{ token: "[audience]", keys: ["s1_audience"] }, { token: "[need]", keys: ["s1_need"] }, { token: "[know]", keys: ["s1_know"] }, { token: "[ask]", keys: ["s1_ask"], drop: true }] },
          { t: "watch", paras: [{ text: "If the AI gives you a long report instead of a table with a short summary, paste the prompt again and tell it: “Follow the format exactly.”" }] },
          { t: "done", text: "the AI has given you a summary table and details." }
        ] },
      { title: "Step 2. Read it and mark what matters", doneKey: "s2_done",
        purpose: "An AI summary is a starting point, not a source. Read it and decide what is most important.",
        blocks: [
          { t: "check", text: "Read the summary table first, then the details. Pick at least three rows and find them in the originals with Find (Ctrl-F). Check anything you plan to use. Notice what surprised you, where the sources disagree, and what the client left vague. Ask yourself whether it blocks you, or whether you can assume something and move on." },
          { t: "turn", text: "Write this in your own words. The prompts from here on use it.", fields: [
            { key: "s2_matters", label: "The 3 to 5 things that matter most, and anything that is wrong or missing", kind: "area" } ] },
          { t: "done", text: "you have checked at least three rows against the originals and written what matters most." }
        ] }
    ] },
    { name: "Write", steps: [
      { title: "Step 3. Write a learning objective", doneKey: "s3_done",
        purpose: "This is the one thing only you can do. The AI can help you check it.",
        blocks: [
          { t: "callout", tone: "blue", paras: [
            { lead: "How to write a good objective:", text: "A good objective says who will do what, in which situation, using a verb you could watch someone do. “Understand safety” cannot be watched. “Decide whether to hold a job when a customer is waiting” can. Write no more than three, and fewer is fine. In a short course, most objectives should come from the Apply level or higher. The builder below helps you get the wording right. Use it." } ] },
          { t: "objmaker", key: "s3_maker", targets: ["s3_o1", "s3_o2", "s3_o3"] },
          { t: "turn", text: "Your objectives are tentative and will change as you learn more. You can type them here or use the builder above to fill these boxes.", fields: [
            { key: "s3_o1", label: "Objective 1", kind: "line" },
            { key: "s3_o2", label: "Objective 2", kind: "line" },
            { key: "s3_o3", label: "Objective 3", kind: "line" } ] },
          { t: "ai", intro: "Optional, but useful if you are stuck. Do not ask the AI to write your objectives. Ask it to check yours.", heading: "Paste this into your AI (same chat)", prompt: `Below is what the course has to change, my notes on what matters most, and my draft learning objectives. Do not rewrite my objectives and do not write new ones for me. Critique only.

For each objective, answer these questions in a table:
1. Is it observable? What would I see someone doing?
2. Is it too big for a short course?
3. Does it connect to what the course has to change?
4. What does it assume? (For example, about authority, time, or tools.)

Then ask me up to two questions that would help me sharpen the objectives.

WHAT THE COURSE HAS TO CHANGE: [need]

WHAT MATTERS MOST (MY NOTES): [matters]

MY OBJECTIVES:
[paste]`,
            fills: [{ token: "[need]", keys: ["s1_need"] }, { token: "[matters]", keys: ["s2_matters"] }, { token: "[paste]", keys: ["s3_o1", "s3_o2", "s3_o3"], join: "\n" }] },
          { t: "check", text: "Can you trace each objective to something the client said? Could you watch someone do it? Edit your objectives above in your own words. Later prompts use what is in those boxes." },
          { t: "done", text: "you have one to three objectives in your own words." }
        ] }
    ] },

      case 'list':
        s.className = 'blk callout tone-gray'; s.appendChild(el('div', 'ctitle', b.title));
        var ul = el('ul'); b.items.forEach(function (i) { ul.appendChild(el('li', null, i)); }); s.appendChild(ul); break;
      case 'compare':
        s.className = 'blk compare'; s.appendChild(el('div', 'ctitle', b.title));
        var g = el('div', 'cmp'); g.appendChild(el('div', 'cmpbox', b.left)); g.appendChild(el('div', 'cmpbox better', b.right)); s.appendChild(g);
        s.appendChild(el('p', 'para', b.why)); break;
    }
    return s;
  }

  /* ---------- views ---------- */
  var views = [{ id: 'start', title: 'Start here', kind: 'start' }];
  var stepNo = 0, doneKeys = [];
  C.phases.forEach(function (ph) {
    ph.steps.forEach(function (st) { stepNo++; doneKeys.push(st.doneKey); views.push({ id: 'step-' + stepNo, title: st.title, kind: 'step', step: st, n: stepNo, phase: ph.name }); });
  });
  views.push({ id: 'save', title: 'Save and export', kind: 'save' });
  var TOTAL = stepNo;
  var main = document.getElementById('main');

  function viewIntro() {
    var f = document.createDocumentFragment();
    f.appendChild(el('h1', null, C.title));
    f.appendChild(el('p', 'lead', C.intro));
    C.paras.forEach(function (p) { f.appendChild(el('p', 'para', p)); });
    var note = el('div', 'callout tone-blue'); note.appendChild(el('p', 'para', C.note)); f.appendChild(note);
    f.appendChild(el('h2', null, 'How this guide works'));
    f.appendChild(el('p', 'para', C.howto));
    var key = el('div', 'keylist');
    C.key.forEach(function (k) {
      var r = el('div', 'keyrow'); var l = el('div', 'lab'); l.appendChild(icon(k.icon)); l.appendChild(el('span', null, k.label));
      r.appendChild(l); r.appendChild(el('div', 'keytext', k.text)); key.appendChild(r);
    });
    f.appendChild(key);
    C.howtoNote.forEach(function (p) { f.appendChild(el('p', 'para', p)); });
    var warn = el('div', 'callout tone-red');
    warn.appendChild(el('p', 'para', 'Do not type confidential client information into this page. Your notes are kept in this browser on this device only.'));
    f.appendChild(warn);
    f.appendChild(backupUI());
    var go = el('button', 'btn primary', 'Begin Step 1'); go.type = 'button'; go.addEventListener('click', function () { goto('step-1'); });
    f.appendChild(go);
    return f;
  }
  function viewStep(v) {
    var f = document.createDocumentFragment();
    f.appendChild(el('div', 'eyebrow', 'Phase: ' + v.phase + '  ·  Step ' + v.n + ' of ' + TOTAL));
    f.appendChild(el('h1', null, v.step.title));
    f.appendChild(el('p', 'lead', v.step.purpose));
    v.step.blocks.forEach(function (b) { f.appendChild(block(b, v.step)); });
    var nxt = views[views.indexOf(v) + 1];
    if ((nxt && nxt.kind === 'step' && nxt.phase !== v.phase) || v.n === TOTAL) {
      var rm = el('div', 'callout tone-blue'); var rp = el('p', 'para');
      rp.appendChild(document.createTextNode('End of the ' + v.phase + ' phase. '));
      var ra = el('a', 'inlinelink', 'Save a backup of your notes now.'); ra.href = '#save'; rp.appendChild(ra); rm.appendChild(rp); f.appendChild(rm);
    }
    if (v.n === TOTAL) { var c = el('div', 'callout tone-gray'); c.appendChild(el('p', 'para', C.closing)); f.appendChild(c); }
    return f;
  }
  function viewSave() {
    var f = document.createDocumentFragment();
    f.appendChild(el('h1', null, 'Save and export'));
    f.appendChild(el('p', 'lead', 'Your notes save automatically in this browser. Use these buttons to keep a copy outside it.'));
    var box = el('div', 'actions');
    var w = el('button', 'btn primary', 'Download my notes as a Word document'); w.type = 'button'; w.id = 'btnWord';
    var c = el('button', 'btn', 'Copy all my notes'); c.type = 'button';
    box.appendChild(w); box.appendChild(c); f.appendChild(box);
    var msg = el('p', 'para msg'); msg.setAttribute('role', 'status'); f.appendChild(msg);
    function notes() { return exporter.collectNotes(C, data); }
    c.addEventListener('click', function () {
      var txt = exporter.notesToText(C.title, notes());
      function ok() { msg.textContent = 'Copied. Paste it into a document.'; }
      function fb() { ta.hidden = false; ta.value = txt; ta.select(); msg.textContent = 'Select all of the text in the box below and copy it.'; }
      try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (e) { fb(); }
    });
    w.addEventListener('click', function () {
      var n = notes();
      if (!n.length) { msg.textContent = 'There is nothing to export yet.'; return; }
      if (!window.docx) { msg.textContent = 'The Word export could not load. Use \u201cCopy all my notes\u201d instead.'; return; }
      var doc = exporter.buildDocx(window.docx, C.title, n);
      window.docx.Packer.toBlob(doc).then(function (blob) {
        return saveFile('My notes - Client Project Guide.docx', blob).then(function () { msg.textContent = 'Your Word document should be in your downloads.'; });
      }).catch(function (e) { msg.textContent = (e && e.code === 'declined') ? 'Download cancelled.' : 'The download did not work. Use \u201cCopy all my notes\u201d instead.'; });
    });
    var ta = el('textarea', 'inp big'); ta.id = 'copybox'; ta.hidden = true; ta.readOnly = true; ta.setAttribute('aria-label', 'All my notes'); f.appendChild(ta);

    f.appendChild(backupUI());

    f.appendChild(el('h2', null, 'Test tools'));
    f.appendChild(el('p', 'para', 'This version has no sign-in. These buttons help you try every feature.'));
    var t = el('div', 'actions');
    var samp = el('button', 'btn', 'Fill with sample notes'); samp.type = 'button';
    var del = el('button', 'btn danger', 'Delete all my notes'); del.type = 'button';
    t.appendChild(samp); t.appendChild(del); f.appendChild(t);
    var conf = el('div', 'callout tone-red'); conf.hidden = true;
    conf.appendChild(el('p', 'para', 'This deletes every note and every checkmark in this browser. You cannot undo it.'));
    var row = el('div', 'actions'); var yes = el('button', 'btn danger', 'Yes, delete everything'); yes.type = 'button';
    var no = el('button', 'btn', 'Cancel'); no.type = 'button'; row.appendChild(yes); row.appendChild(no); conf.appendChild(row); f.appendChild(conf);
    samp.addEventListener('click', function () { data = JSON.parse(JSON.stringify(SAMPLE)); persist(); msg.textContent = 'Sample notes added (a made-up example, not a real client). Look through the steps.'; updateNav(); });
    del.addEventListener('click', function () { conf.hidden = false; });
    no.addEventListener('click', function () { conf.hidden = true; });
    yes.addEventListener('click', function () { data = {}; persist(); conf.hidden = true; msg.textContent = 'All notes deleted.'; updateNav(); });
    return f;
  }

  /* ---------- nav ---------- */
  var nav = document.getElementById('navlist');
  var navBtns = {};
  function buildNav() {
    nav.innerHTML = '';
    function item(v, extra) {
      var li = el('li'); var a = el('a', 'navitem'); a.href = '#' + v.id;
      var dot = el('span', 'dot'); a.appendChild(dot);
      a.appendChild(el('span', 'navtext', extra || v.title)); li.appendChild(a); nav.appendChild(li); navBtns[v.id] = { a: a, dot: dot, v: v };
    }
    item(views[0]);
    var n = 0;
    C.phases.forEach(function (ph) {
      nav.appendChild(el('li', 'navphase', ph.name));
      ph.steps.forEach(function (st) { n++; item(views[n], st.title.replace(/^Step \d+\.\s*/, '')); navBtns['step-' + n].dot.textContent = String(n); });
    });
    nav.appendChild(el('li', 'navphase', 'Tools'));
    item(views[views.length - 1]);
  }
  function updateNav() {
    var done = 0;
    for (var i = 1; i <= TOTAL; i++) {
      var d = !!data[doneKeys[i - 1]];
      if (d) done++;
      navBtns['step-' + i].a.classList.toggle('isdone', d);
    }
    document.getElementById('progtext').textContent = done + ' of ' + TOTAL + ' steps done';
    document.getElementById('progfill').style.width = (done / TOTAL * 100) + '%';
    document.getElementById('progbar').setAttribute('aria-valuenow', String(done));
  }

  function goto(id) { if (location.hash === '#' + id) show(); else location.hash = id; }
  function show() {
    var h = (location.hash || '').replace('#', '');
    var v = views.filter(function (x) { return x.id === h; })[0] || views[0];
    updaters = []; fieldEls = [];
    main.innerHTML = '';
    var wrap = el('div', 'page');
    wrap.appendChild(v.kind === 'start' ? viewIntro() : v.kind === 'step' ? viewStep(v) : viewSave());
    var i = views.indexOf(v), pn = el('div', 'pn');
    if (i > 0) { var p = el('a', 'btn', '‹ Back'); p.href = '#' + views[i - 1].id; pn.appendChild(p); } else pn.appendChild(el('span'));
    if (i < views.length - 1) { var n = el('a', 'btn primary', i === 0 ? 'Begin Step 1 ›' : 'Next ›'); n.href = '#' + views[i + 1].id; pn.appendChild(n); }
    wrap.appendChild(pn);
    main.appendChild(wrap);
    Object.keys(navBtns).forEach(function (k) { navBtns[k].a.classList.toggle('current', k === v.id); });
    document.body.classList.remove('navopen');
    setTimeout(function () { main.querySelectorAll('textarea.inp').forEach(grow); }, 0);
    window.scrollTo(0, 0);
  }

  /* ---------- boot ---------- */
  var exporter = { collectNotes: collectNotes, notesToText: notesToText, buildDocx: buildDocx };
  load(); buildNav(); updateNav();
  window.addEventListener('hashchange', show);
  document.getElementById('menubtn').addEventListener('click', function () { document.body.classList.toggle('navopen'); });
  document.getElementById('scrim').addEventListener('click', function () { document.body.classList.remove('navopen'); });
  show();
  if (memOnly) setStatus('Not saved: this browser blocks storage. Copy your notes before leaving.');
  document.getElementById('themebtn').addEventListener('click', function () {
    var root = document.documentElement, cur = root.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
